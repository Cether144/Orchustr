[package]
authors.workspace = true
edition.workspace = true
description = "Short-term, long-term, and episodic memory stores for Orchustr agents."
license.workspace = true
name = "or-recall"
rust-version.workspace = true
version.workspace = true

[features]
default = []
sqlite = ["dep:sqlx"]

[dependencies]
or-core = { path = "../or-core", version = "0.1.3" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite"], optional = true }

[dev-dependencies]
mockall.workspace = true
serde_json.workspace = true
tokio.workspace = true
